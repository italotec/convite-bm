{% extends "base.html" %}
{% block content %}

<div class="card mb-4">
  <div class="font-semibold mb-3">Criar usuário</div>
  <form method="post" action="{{ url_for('admin.create_user') }}" class="flex flex-wrap gap-2 items-end">
    <div>
      <label class="text-xs text-zinc-400 block mb-1">Usuário</label>
      <input type="text" name="username" required class="input" />
    </div>
    <div>
      <label class="text-xs text-zinc-400 block mb-1">Senha</label>
      <input type="text" name="password" required class="input" />
    </div>
    <button type="submit" class="btn bg-emerald-700 hover:bg-emerald-600">Criar</button>
  </form>
</div>

<div class="card">
  <div class="font-semibold mb-3">Usuários</div>
  <div class="space-y-2">
    {% for u in users %}
      <div class="flex items-center justify-between text-sm border-b border-zinc-800 pb-2 last:border-0 last:pb-0">
        <div>
          <a href="{{ url_for('admin.admin_user_detail', user_id=u.id) }}" class="font-medium hover:underline">{{ u.username }}</a>
          {% if u.is_admin %}<span class="badge bg-indigo-900 text-indigo-300 ml-1">admin</span>{% endif %}
          {% if u.is_banned %}<span class="badge bg-red-900 text-red-300 ml-1">banido</span>{% endif %}
        </div>
        <div class="flex gap-2">
          {% if u.id != current_user.id %}
            <form method="post" action="{{ url_for('admin.toggle_admin', user_id=u.id) }}">
              <button class="btn text-xs bg-zinc-800 hover:bg-zinc-700" type="submit">{{ 'remover admin' if u.is_admin else 'tornar admin' }}</button>
            </form>
            <form method="post" action="{{ url_for('admin.toggle_ban', user_id=u.id) }}">
              <button class="btn text-xs {{ 'bg-red-900 hover:bg-red-800' if not u.is_banned else 'bg-zinc-800 hover:bg-zinc-700' }}" type="submit">{{ 'banir' if not u.is_banned else 'desbanir' }}</button>
            </form>
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
